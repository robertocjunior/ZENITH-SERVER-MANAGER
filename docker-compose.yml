name: zenith-server-manager

services:
  # ============================================================================
  # 1. VictoriaMetrics (TSDB - Armazenamento de Séries Temporais)
  # ============================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.98.0
    container_name: zenith-victoriametrics
    restart: unless-stopped
    command:
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    ports:
      - "${VM_PORT:-8428}:8428"
    networks:
      - zenith-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 2. Zenith Monitor (Coletor Agentless TOTVS Protheus & Dashboard Web)
  # ============================================================================
  zenith-monitor:
    container_name: zenith-monitor
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      victoriametrics:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ZENITH_TSDB_URL=http://victoriametrics:8428
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "${ZENITH_PORT:-8080}:8080"
    networks:
      - zenith-net

# ==============================================================================
# Redes & Volumes Isolados
# ==============================================================================
networks:
  zenith-net:
    driver: bridge

volumes:
  vmdata:
    driver: local
